<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clara Voice Agent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div>
                <h1>Clara</h1>
                <p class="subtitle">Voice Assistant Sandbox</p>
            </div>
            
            <div class="mic-button-wrapper" id="micWrapper">
                <button class="mic-button" id="recordBtn" aria-label="Record voice">🎤</button>
            </div>
            
            <div class="status" id="statusMsg">Click to Start Recording</div>
            
            <div class="result-container" id="resultContainer">
                <div class="result-header">
                    <span class="result-label">Transcript</span>
                    <button class="copy-btn" id="copyBtn">Copy</button>
                </div>
                <div class="transcript-card" id="resultText"></div>
            </div>

            <!-- Divider -->
            <hr class="divider">
            
            <!-- TTS Section -->
            <div class="tts-container">
                <div class="result-header">
                    <span class="result-label">Text to Speech (ElevenLabs)</span>
                </div>
                <div class="tts-input-group">
                    <input type="text" id="ttsInput" placeholder="Type something for Clara to say..." autocomplete="off">
                    <button id="ttsBtn" class="tts-button">🔊 Speak</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    let mediaRecorder = null;
    let audioStream = null;
    let chunks = [];
    let isRecording = false;

    const recordBtn = document.getElementById('recordBtn');
    const micWrapper = document.getElementById('micWrapper');
    const statusMsg = document.getElementById('statusMsg');
    const resultContainer = document.getElementById('resultContainer');
    const resultText = document.getElementById('resultText');
    const copyBtn = document.getElementById('copyBtn');

    // Click handler to toggle between recording states
    recordBtn.addEventListener('click', async () => {
        if (!isRecording) {
            await startRecording();
        } else {
            stopRecording();
        }
    });

    async function startRecording() {
        try {
            statusMsg.textContent = "Requesting mic access...";
            statusMsg.className = "status processing";

            audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            chunks = [];
            mediaRecorder = new MediaRecorder(audioStream);
            
            mediaRecorder.ondataavailable = e => {
                if (e.data && e.data.size > 0) {
                    chunks.push(e.data);
                }
            };

            mediaRecorder.onstop = async () => {
                try {
                    statusMsg.textContent = "Transcribing voice...";
                    statusMsg.className = "status processing";

                    const blob = new Blob(chunks, { type: mediaRecorder.mimeType });
                    console.log("[STT Frontend] Recorded audio blob size:", blob.size, "bytes");

                    if (blob.size < 100) {
                        statusMsg.textContent = "Recording too short or empty! Please speak into the mic.";
                        statusMsg.style.color = "var(--red-alert)";
                        statusMsg.className = "status";
                        recordBtn.disabled = false;
                        recordBtn.textContent = "🎤";
                        return;
                    }

                    statusMsg.textContent = "Transcribing voice...";
                    statusMsg.className = "status processing";

                    const formData = new FormData();
                    formData.append('audio', blob, 'recording.webm');

                    // Call FastAPI backend running on local port 8000
                    const res = await fetch('http://localhost:8000/transcribe', {
                        method: 'POST',
                        body: formData
                    });

                    if (!res.ok) {
                        throw new Error(`HTTP error! status: ${res.status}`);
                    }

                    const data = await res.json();
                    
                    // Show result
                    resultText.textContent = data.transcript || "(No speech detected)";
                    resultContainer.classList.add('show');
                    
                    statusMsg.textContent = "Click to Start Recording";
                    statusMsg.className = "status";
                } catch (err) {
                    console.error("Transcription error:", err);
                    statusMsg.textContent = "Error transcribing audio";
                    statusMsg.style.color = "var(--red-alert)";
                } finally {
                    recordBtn.disabled = false;
                    recordBtn.textContent = "🎤";
                }
            };

            mediaRecorder.start();
            isRecording = true;
            
            // Update UI to recording state
            micWrapper.classList.add('recording');
            recordBtn.textContent = "⏹️";
            statusMsg.textContent = "Recording... Click again to stop";
            statusMsg.className = "status recording";

        } catch (err) {
            console.error("Microphone access denied or error:", err);
            statusMsg.textContent = "Microphone access denied";
            statusMsg.style.color = "var(--red-alert)";
            statusMsg.className = "status";
            isRecording = false;
        }
    }

    function stopRecording() {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
        }
        
        // Stop all audio tracks to turn off the recording light in browser
        if (audioStream) {
            audioStream.getTracks().forEach(track => track.stop());
        }

        isRecording = false;
        micWrapper.classList.remove('recording');
        recordBtn.disabled = true; // Disable button while sending request
    }

    // Copy to clipboard functionality
    copyBtn.addEventListener('click', () => {
        const text = resultText.textContent;
        if (text) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = copyBtn.textContent;
                copyBtn.textContent = "Copied!";
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                }, 2000);
            });
        }
    });

    // Text to Speech logic
    const ttsInput = document.getElementById('ttsInput');
    const ttsBtn = document.getElementById('ttsBtn');

    ttsBtn.addEventListener('click', async () => {
        const text = ttsInput.value.trim();
        if (!text) return;
        
        try {
            ttsBtn.disabled = true;
            ttsBtn.textContent = "⏳ Speaking...";
            
            const res = await fetch('http://localhost:8000/speak', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ text })
            });
            
            if (!res.ok) {
                throw new Error(`HTTP error! status: ${res.status}`);
            }
            
            const audioBlob = await res.blob();
            const audioUrl = URL.createObjectURL(audioBlob);
            const audio = new Audio(audioUrl);
            await audio.play();
            
        } catch (err) {
            console.error("TTS synthesis error:", err);
            statusMsg.textContent = "Error playing synthesized voice";
            statusMsg.style.color = "var(--red-alert)";
            setTimeout(() => {
                statusMsg.textContent = "Click to Start Recording";
                statusMsg.style.color = "var(--text-muted)";
            }, 3000);
        } finally {
            ttsBtn.disabled = false;
            ttsBtn.textContent = "🔊 Speak";
        }
    });
    </script>
</body>
</html>
