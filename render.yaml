services:
  # 1. Express API Backend
  - type: web
    name: mrbrown-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm run start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mrbrown-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: mrbrown-redis
          property: connectionString
      # User provided keys — fill these in on the Render dashboard
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  # 2. TanStack Start + Nitro SSR Frontend (Node service, NOT static)
  - type: web
    name: mrbrown-frontend
    env: node
    plan: free
    rootDir: clara-keeps-secrets
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

  # 3. Redis Cache
  - type: redis
    name: mrbrown-redis
    plan: free
    ipAllowList: [] # Allow only internal services to connect

# 4. PostgreSQL Database with pgvector support
databases:
  - name: mrbrown-db
    plan: free
    postgresMajorVersion: 15
